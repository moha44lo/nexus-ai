name: Deploy NEXUS to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - feat/nexus-autonomy-foundation

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm test
      - name: Check required deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXUS_PIN: ${{ secrets.NEXUS_PIN }}
          NEXUS_SESSION_SECRET: ${{ secrets.NEXUS_SESSION_SECRET }}
          NEXUS_MCP_TOKEN: ${{ secrets.NEXUS_MCP_TOKEN }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXUS_PIN NEXUS_SESSION_SECRET NEXUS_MCP_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          for name in NEXUS_SESSION_SECRET NEXUS_MCP_TOKEN; do
            if [[ ${#name} -gt 0 && ${#${!name}} -lt 32 ]]; then
              echo "::error::$name must contain at least 32 characters"
              exit 1
            fi
          done
      - name: Apply D1 schema
        run: npx wrangler d1 execute nexus --remote --file=./schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Configure NEXUS Worker secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXUS_PIN: ${{ secrets.NEXUS_PIN }}
          NEXUS_SESSION_SECRET: ${{ secrets.NEXUS_SESSION_SECRET }}
          NEXUS_MCP_TOKEN: ${{ secrets.NEXUS_MCP_TOKEN }}
        run: |
          set -euo pipefail
          for name in NEXUS_PIN NEXUS_SESSION_SECRET NEXUS_MCP_TOKEN; do
            value="${!name}"
            if [[ -z "$value" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
            if [[ "$name" != "NEXUS_PIN" && ${#value} -lt 32 ]]; then
              echo "::error::$name must contain at least 32 characters"
              exit 1
            fi
            printf '%s' "$value" | npx wrangler secret put "$name"
          done
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
