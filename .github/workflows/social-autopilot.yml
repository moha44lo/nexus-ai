name: NEXUS Social Autopilot checks

on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "schema.sql"
      - "package.json"
      - ".github/workflows/social-autopilot.yml"
  push:
    branches:
      - main
      - feature/social-autopilot-v1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax checks
        run: npm run check
      - name: Unit tests
        run: npm test
